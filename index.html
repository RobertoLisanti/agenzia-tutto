<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="backBtn" hidden aria-label="Indietro">

        </button>
        <a class="brand" href="#/">

          <div class="brand-text">

            <p id="topSub" class="muted">Facciamo tutto</p>
          </div>
        </a>
        <div class="topbar-actions">
          <a class="cart-btn" href="#/carrello" aria-label="Carrello">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.55L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>

          </a>
          <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="menu" id="menu" hidden role="menu">
            <button class="menu-item" role="menuitem" data-goto="#/">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
              <span>Home</span>
            </button>
            <button class="menu-item" role="menuitem" data-goto="#/ordini">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l1 4H5l1-4Z"/><path d="M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/><path d="M9 11h6"/></svg>

            <button class="menu-item" role="menuitem" data-goto="#/account">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
              <span>Account</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="view"></main>

  <div id="overlay" class="overlay-host" hidden></div>
  <div id="toast" class="toast"></div>

  <script src="config.js?v=3"></script>
  <script src="vendor/supabase.js"></script>
