<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Beer e VIP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2029"/><stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="26%" r="72%">
      <stop offset="0" stop-color="#f2a71b" stop-opacity=".30"/>
      <stop offset="1" stop-color="#f2a71b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#glow)"/>

  <!-- riflettori: e' la collezione dei vip -->
  <path d="M0 0 L96 200 L44 200 Z" fill="#ffffff" opacity=".045"/>
  <path d="M320 0 L224 200 L276 200 Z" fill="#ffffff" opacity=".045"/>

  <!-- boccale -->
  <g transform="translate(160 58)">
    <path d="M-24 -16 h40 a5 5 0 0 1 5 5 v34 a11 11 0 0 1 -11 11 h-28 a11 11 0 0 1 -11 -11 v-34 a5 5 0 0 1 5 -5 z"
          fill="#f2a71b" opacity=".92"/>
    <path d="M-24 -6 h50 v-5 a5 5 0 0 0 -5 -5 h-40 a5 5 0 0 0 -5 5 z" fill="#fff" opacity=".85"/>
    <circle cx="-16" cy="-19" r="8" fill="#fff" opacity=".9"/>
    <circle cx="-2" cy="-23" r="9.5" fill="#fff" opacity=".9"/>
    <circle cx="13" cy="-19" r="7.5" fill="#fff" opacity=".9"/>
    <path d="M21 -8 h9 a11 11 0 0 1 11 11 v7 a11 11 0 0 1 -11 11 h-9" fill="none" stroke="#f2a71b" stroke-width="6" opacity=".92"/>
  </g>

  <!-- stelle da red carpet -->
  <g fill="#f2a71b" opacity=".9">
    <path d="M46 96 l3.2 6.6 7.2 1 -5.2 5.1 1.2 7.2 -6.4-3.4 -6.4 3.4 1.2-7.2 -5.2-5.1 7.2-1 z"/>
    <path d="M274 96 l3.2 6.6 7.2 1 -5.2 5.1 1.2 7.2 -6.4-3.4 -6.4 3.4 1.2-7.2 -5.2-5.1 7.2-1 z"/>
  </g>

  <text x="160" y="132" text-anchor="middle"
        font-family="Oswald, Impact, 'Arial Narrow', Haettenschweiler, sans-serif"
        font-size="42" font-weight="700" letter-spacing="1">
    <tspan fill="#eef1f6">Beer</tspan><tspan fill="#f2a71b">&amp;VIP</tspan>
  </text>
  <text x="160" y="158" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="4.5" fill="#a2abbb">COLLEZIONE 2025</text>
</svg>
